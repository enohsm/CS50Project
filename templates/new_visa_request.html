{% extends 'layout.html' %}

{% block javascript2 %}
<script src="{{ url_for('static', filename='earliestdate.js') }}"></script>
{% endblock %}

{% block title %}
    New Visa Request
{% endblock %}

{% block main %}
<form class="form-horizontal" action="{{ url_for('request.new_visa_request') }}" method="post">
    <h1>New Visa Request</h1>
    <div class="form-group">
        <label class="control-label col-sm-5" for="pass_no">Passport:</label>
        <div class="col-sm-3">
            <select class="form-control" id="pass_no" name="pass_no" required>
                <option selected disabled>- Passport No. | Date of Expiry</option>
                {% for passport in passports %}
                <option value="{{ passport.pass_no }}">{{ passport.pass_no }} | {{ passport.pass_exp }} </option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="country">Country:</label>
        <div class="col-sm-2">
            <select class="form-control" id="country" name="country" required>
                <option selected disabled>Select Country</option>
                {% for country in countries %}
                <option value="{{ country }}">{{ country }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="pref_date">Prefferred Appointment Date:</label>
        <div class="col-sm-2">
            <input class="form-control" id="pref_date" name="pref_date" autocomplete="off" type="date" required>
        </div>
    </div>
    <div class="form-group text-center">
        <button class="btn btn-info btn-lg" type="submit">Create Request</button>
    </div>
</form>
{% endblock %}
