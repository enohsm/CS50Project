{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
<form class="form-horizontal" action="/login" method="post">
    <h1>Login</h1>
    <div class="form-group">
        <label class="control-label col-sm-5" for="username">Username:</label>
        <div class="col-sm-2">
            <input class="form-control" id="username" name="username" autocomplete="off" placeholder="Username" type="text" autofocus="on" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="password">Password:</label>
        <div class="col-sm-2">
            <input class="form-control" id="password" name="password" autocomplete="off" placeholder="Password" type="password" required>
        </div>
    </div>
    <div class="form-group text-center">
        <button class="btn btn-info btn-lg" type="submit">Login</button>
    </div>
</form>
{% endblock %}
