{% extends 'layout.html' %}

{% block title %}
    Delete Vehicle
{% endblock %}

{% block main %}
<form class="form-horizontal" action="{{ url_for('profile.delete_vehicle', id = vehicle_id) }}" method="POST">
    <h1>Delete Vehicle</h1>
    <p class="text-center">The vehicle with plate number <b>{{ plate }}</b> and all past green insurance requests associated with this vehicle will be deleted. Do you confirm?</p>
    <div class="form-group">
        <label class="control-label col-sm-5">Enter your password:</label>
        <div class="col-sm-2">
            <input class="form-control" id="password" name="password" autocomplete="off" autofocus type="password" required>
        </div>
    </div>
    <div class="form-group text-center">
        <button class="btn btn-info btn-lg" type="submit">Delete Vehicle</button>
    </div>
</form>
{% endblock %}
