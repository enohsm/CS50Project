{% extends 'layout.html' %}

{% block title %}
    Create Green Card Order
{% endblock %}

{% block main %}
<form class="form-horizontal" action="{{ url_for('dashboard.send_greencard', id = greencard.id) }}" method="post">
    <h1>Create Order for Green Card Insurance</h1>
    <div class="form-group text-center">
        <label class="control-label col-sm-5" for="view_button">View Passport:</label>
        <div class="col-sm-2">
            <i class="bi bi-eye-fill view-button" id="view_button" style="color: rgb(116, 116, 0)" onclick="window.open('/me/vehicles/view?id={{ greencard.vehicle_id }}', '_blank', 'width=800, height=800'); return false"></i>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="name">Name & Surname:</label>
        <div class="col-sm-2">
            <input class="form-control" id="name" name="name" autocomplete="off" placeholder="Name & Surname" type="text" pattern="^[A-Za-z ]+$" autofocus value="{{ greencard.namesurname }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="plate">Plate:</label>
        <div class="col-sm-2">
            <input class="form-control" id="plate" name="plate" autocomplete="off" placeholder="Plate" type="text" pattern="^[0-9]{2}[A-Za-z]{1,3}[0-9]{1,4}$" value="{{ greencard.plate }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="vin">VIN:</label>
        <div class="col-sm-2">
            <input class="form-control" id="vin" name="vin" autocomplete="off" placeholder="VIN" type="text" pattern="^[A-Za-z0-9]{17}$" value="{{ greencard.vin }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="brand">Brand:</label>
        <div class="col-sm-2">
            <input class="form-control" id="brand" name="brand" autocomplete="off" placeholder="Brand" type="text" value="{{ greencard.brand }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="type">Type:</label>
        <div class="col-sm-2">
            <input class="form-control" id="type" name="type" autocomplete="off" placeholder="Type" type="text" value="{{ greencard.model }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="color">Color:</label>
        <div class="col-sm-2">
            <input class="form-control" id="color" name="color" autocomplete="off" placeholder="Color" type="text" pattern="^[A-Za-z -()]+$" value="{{ greencard.color }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="start_date">Start Date:</label>
        <div class="col-sm-2">
            <input class="form-control" id="start_date" name="start_date" autocomplete="off" type="date" value="{{ greencard.startdate | input_date }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="policy_no">Policy Number:</label>
        <div class="col-sm-2">
            <input class="form-control" id="policy_no" name="policy_no" autocomplete="off" placeholder="Policy Number" type="text" pattern="^[0-9]{6}$" required>
        </div>
    </div>
    <div class="form-group text-center">
        <button class="btn btn-info btn-lg" type="submit">Create Order</button>
    </div>
</form>
{% endblock %}
