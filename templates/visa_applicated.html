{% extends 'layout.html' %}

{% block title %}
    Visa Applicated
{% endblock %}

{% block main %}
<h1>Visa Applicated</h1>
<form class="form-horizontal" action="{{ url_for('dashboard.visa_applicated') }}" method="post">
    <input type="hidden" name="id" value="{{ visa.id }}">
    <div class="form-group">
        <label class="control-label col-sm-5" for="country">Country:</label>
        <div class="col-sm-3">
            <input class="form-control" id="country" value="{{ visa.country }}" disabled>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="name">Name & Surname:</label>
        <div class="col-sm-3">
            <input class="form-control" id="name" value="{{ visa.name }} {{ visa.surname }}" disabled>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="pass_no">Passport No:</label>
        <div class="col-sm-3">
            <input class="form-control" id="pass_no" value="{{ visa.pass_no }}" disabled>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="app_date">Appointment Date:</label>
        <div class="col-sm-3">
            <input class="form-control" id="app_date" value="{{ visa.app_date }}" disabled>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="ref_no">Reference No:</label>
        <div class="col-sm-3">
            <input class="form-control" id="ref_no" name="ref_no" autocomplete="off" type="text" placeholder="Reference Number" max-length="50" required>
        </div>
    </div>
    <div class="form-group text-center">
        <button class="btn btn-info btn-lg">Set Applicated</button>
    </div>
</form>
{% endblock %}
