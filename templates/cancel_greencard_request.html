{% extends 'layout.html' %}

{% block title %}
    Cancellation Green Card Request
{% endblock %}

{% block main %}
<form class="form-horizontal" action="{{ url_for('request.cancellation_gc_request', id = greencard.id) }}" method="post">
    <h1>Cancellation Green Card Request</h1>
    <div class="form-group text-center">
        <p>Do you confirm cancellation of your green card insurance request with plate <b>{{ greencard.plate }}</b> ?</p>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="password">Enter your password:</label>
        <div class="col-sm-2">
            <input class="form-control" id="password" name="password" autofocus autocomplete="off" type="password" required>
        </div>
    </div>
    <div class="form-group text-center">
        <button class="btn btn-info btn-lg" type="submit">Confirm Cancellation</button>
    </div>
</form>
{% endblock %}
