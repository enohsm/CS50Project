{% extends "layout.html" %}

{% block title %}
    Delete Passport
{% endblock %}

{% block main %}
<form class="form-horizontal" action="{{ url_for('profile.delete_passport', id = passport_id) }}" method="POST">
    <h1>Delete Passport</h1>
    <div class="form-group text-center">
        <p>The passport with number <b>{{ passport_no }}</b> and all past visa requests associated with this passport will be deleted. Do you confirm?</p>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="password">Enter your password:</label>
        <div class="col-sm-2">
            <input class="form-control" id="password" name="password" autofocus autocomplete="off" type="password" required>
        </div>
    </div>
    <div class="form-group text-center">
        <button class="btn btn-info btn-lg">Confirm Delete</button>
    </div>
</form>
{% endblock %}
