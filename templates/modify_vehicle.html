{% extends "layout.html" %}

{% block title %}
    Modify Vehicle
{% endblock %}

{% block main %}
<form class="form-horizontal" action="/me/vehicles/modify?id={{ vehicle.id }}" method="post">
    <h1>Modify Vehicle</h1>
    <div class="form-group">
        <label class="control-label col-sm-5" for="name">Name & Surname:</label>
        <div class="col-sm-2">
            <input class="form-control" id="name" name="name" autocomplete="off" placeholder="Name & Surname" type="text" pattern="^[A-Za-z ]+$" autofocus value="{{ vehicle.namesurname }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="plate">Plate:</label>
        <div class="col-sm-2">
            <input class="form-control" id="plate" name="plate" autocomplete="off" placeholder="Plate" type="text" pattern="^[0-9]{2}[A-Za-z]{1,3}[0-9]{1,4}$" value="{{ vehicle.plate }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="vin">VIN:</label>
        <div class="col-sm-2">
            <input class="form-control" id="vin" name="vin" autocomplete="off" placeholder="VIN" type="text" pattern="^[A-Za-z0-9]{17}$" value="{{ vehicle.vin }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="brand">Brand:</label>
        <div class="col-sm-2">
            <input class="form-control" id="brand" name="brand" autocomplete="off" placeholder="Brand" type="text" value="{{ vehicle.brand }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="type">Type:</label>
        <div class="col-sm-2">
            <input class="form-control" id="type" name="type" autocomplete="off" placeholder="Type" type="text" value="{{ vehicle.model }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-5" for="color">Color:</label>
        <div class="col-sm-2">
            <input class="form-control" id="color" name="color" autocomplete="off" placeholder="Color" type="text" pattern="^[A-Za-z -()]+$" value="{{ vehicle.color }}" required>
        </div>
    </div>
    <div class="form-group text-center">
        <button class="btn btn-info btn-lg" type="submit">Modify Vehicle</button>
    </div>
</form>
{% endblock %}
